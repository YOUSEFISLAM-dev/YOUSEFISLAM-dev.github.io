<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenuCraft — Restaurant Menu Builder</title>
<meta name="description" content="Create stunning digital menus for your restaurant. No backend needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&family=Caveat:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07070e;--surface:rgba(18,18,32,.75);--surface2:rgba(30,30,50,.8);--surface3:#282840;--border:rgba(60,60,100,.35);--text:#e8e8f0;--text2:#a0a0b8;--text3:#6a6a80;--primary:#7c5cfc;--primary-glow:rgba(124,92,252,.3);--accent:#f472b6;--success:#34d399;--warning:#fbbf24;--danger:#ef4444;--radius:14px;--radius-lg:22px;--radius-xl:28px;--transition:all .3s cubic-bezier(.4,0,.2,1);--font:'Inter',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden}
a{color:var(--primary);text-decoration:none}
input,select,textarea,button{font-family:inherit;font-size:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:9px}
#creator{display:flex;flex-direction:column;min-height:100vh;position:relative}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45}
.creator-header,.creator-body,.modal-overlay{position:relative;z-index:2}
.creator-header{position:sticky;top:0;z-index:100;background:rgba(7,7,14,.7);backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid var(--border);padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 4px 16px var(--primary-glow)}
.header-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border:none;border-radius:var(--radius);font-weight:600;font-size:.875rem;cursor:pointer;transition:var(--transition);white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),#9f7afa);color:#fff;box-shadow:0 4px 20px var(--primary-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--primary-glow)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(8px)}
.btn-secondary:hover{background:var(--surface3);border-color:var(--primary);transform:translateY(-1px)}
.btn-sm{padding:7px 14px;font-size:.8rem;border-radius:10px}
.btn-icon{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:var(--transition);font-size:1.1rem;backdrop-filter:blur(8px)}
.btn-icon:hover{background:var(--surface3);color:var(--text);border-color:var(--primary);transform:scale(1.08)}
.creator-body{display:grid;grid-template-columns:1fr 1fr;flex:1;gap:0}
@media(max-width:1100px){.creator-body{grid-template-columns:1fr}.preview-panel{display:none}}
.form-panel{padding:28px 32px;overflow-y:auto;max-height:calc(100vh - 68px);border-right:1px solid var(--border)}
.form-section{margin-bottom:28px;animation:fadeUp .5s both}
.section-label{display:flex;align-items:center;gap:10px;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:18px}
.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 16px;background:rgba(18,18,32,.6);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.88rem;transition:var(--transition);outline:none;backdrop-filter:blur(8px)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow);background:rgba(24,24,44,.8)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px}
.emoji-opt{width:46px;height:46px;border:2px solid var(--border);border-radius:12px;display:grid;place-items:center;font-size:1.5rem;cursor:pointer;transition:var(--transition);background:rgba(18,18,32,.4)}
.emoji-opt:hover{transform:scale(1.15);border-color:var(--text3)}
.emoji-opt.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow);background:rgba(124,92,252,.12);transform:scale(1.1)}
.font-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.font-opt{padding:14px 10px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:center;transition:var(--transition);background:rgba(18,18,32,.4)}
.font-opt:hover{border-color:var(--text3);transform:translateY(-2px)}
.font-opt.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow);background:rgba(124,92,252,.08)}
.font-opt .font-preview{font-size:1.1rem;margin-bottom:4px;color:var(--text)}
.font-opt .font-label{font-size:.68rem;color:var(--text3);font-family:var(--font)}
.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.template-card{position:relative;border:2px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;overflow:hidden;transition:var(--transition);background:var(--surface)}
.template-card:hover{border-color:var(--text3);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.template-card.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.template-card .tmpl-preview{height:70px;width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.template-card .tmpl-info{padding:8px 12px}
.template-card .tmpl-name{font-weight:700;font-size:.75rem}
.template-card .tmpl-desc{font-size:.62rem;color:var(--text3);margin-top:1px}
.template-card .tmpl-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--primary);display:none;place-items:center;color:#fff;font-size:12px;z-index:2}
.template-card.active .tmpl-check{display:grid}
.tmpl-elegant .tmpl-preview{background:linear-gradient(135deg,#1a1a2e,#16213e)}.tmpl-elegant .tmpl-preview::after{content:'✦';font-size:1.6rem;color:#c9a96e;opacity:.7}
.tmpl-modern .tmpl-preview{background:linear-gradient(135deg,#f8f9fa,#e9ecef)}.tmpl-modern .tmpl-preview::after{content:'◈';font-size:1.6rem;color:#333;opacity:.5}
.tmpl-rustic .tmpl-preview{background:linear-gradient(135deg,#3e2723,#4e342e)}.tmpl-rustic .tmpl-preview::after{content:'☘';font-size:1.6rem;color:#a5d6a7;opacity:.7}
.tmpl-minimal .tmpl-preview{background:#fff}.tmpl-minimal .tmpl-preview::after{content:'—';font-size:1.6rem;color:#111;opacity:.3}
.tmpl-neon .tmpl-preview{background:linear-gradient(135deg,#0a0a1a,#1a0a2e)}.tmpl-neon .tmpl-preview::after{content:'⚡';font-size:1.6rem;color:#00f5ff;opacity:.8}
.tmpl-garden .tmpl-preview{background:linear-gradient(135deg,#f0f7e6,#e8f5e9)}.tmpl-garden .tmpl-preview::after{content:'🌿';font-size:1.5rem;opacity:.7}
.tmpl-glass .tmpl-preview{background:linear-gradient(135deg,#667eea,#764ba2)}.tmpl-glass .tmpl-preview::after{content:'💎';font-size:1.5rem;opacity:.8}
.color-pickers{display:flex;gap:16px;flex-wrap:wrap}
.color-field{display:flex;flex-direction:column;gap:6px;align-items:center}
.color-field span{font-size:.7rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.color-field input[type=color]{width:56px;height:56px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;background:none;padding:3px;transition:var(--transition)}
.color-field input[type=color]:hover{border-color:var(--primary);transform:scale(1.08)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:9px}
.category-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;transition:var(--transition);backdrop-filter:blur(12px)}
.category-block:hover{border-color:rgba(124,92,252,.3);box-shadow:0 4px 20px rgba(0,0,0,.15)}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cat-header input{flex:1;font-size:1rem;font-weight:700;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);padding:4px 0;outline:none}
.cat-header input:focus{border-bottom-color:var(--primary)}
.cat-actions{display:flex;gap:6px}
.item-row{display:grid;grid-template-columns:1fr;gap:6px;padding:12px;margin-bottom:8px;background:rgba(18,18,32,.35);border-radius:var(--radius);border:1px solid rgba(60,60,100,.15);transition:var(--transition)}
.item-row:hover{border-color:rgba(124,92,252,.2)}
.item-row .ir-top{display:grid;grid-template-columns:1fr 1.5fr .5fr auto 34px;gap:8px;align-items:center}
.item-row .ir-bottom{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:4px}
.item-row input,.item-row select{padding:8px 10px;background:rgba(30,30,50,.5);border:1px solid transparent;border-radius:10px;color:var(--text);font-size:.8rem;outline:none;transition:var(--transition)}
.item-row input:focus,.item-row select:focus{border-color:var(--primary)}
.item-row .img-input{font-size:.72rem;color:var(--text3)}
.item-row .img-actions{display:flex;gap:4px}
.item-row .img-upload-btn{padding:6px 10px;background:rgba(124,92,252,.08);border:1px dashed rgba(124,92,252,.3);border-radius:8px;color:var(--primary);font-size:.68rem;font-weight:600;cursor:pointer;transition:var(--transition);white-space:nowrap}
.item-row .img-upload-btn:hover{background:rgba(124,92,252,.15)}
.item-row .img-preview{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
.cat-desc-input{width:100%;padding:8px 12px;background:rgba(30,30,50,.4);border:1px solid transparent;border-radius:10px;color:var(--text2);font-size:.78rem;outline:none;transition:var(--transition);margin-bottom:10px;font-style:italic}
.cat-desc-input:focus{border-color:var(--primary)}
.item-row select{padding:8px 4px;font-size:.68rem;color:var(--text2);cursor:pointer}
.add-item-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;margin-top:10px;background:rgba(124,92,252,.06);color:var(--primary);border:1px dashed rgba(124,92,252,.25);border-radius:10px;cursor:pointer;font-size:.78rem;font-weight:600;transition:var(--transition);width:100%}
.add-item-btn:hover{background:rgba(124,92,252,.14);border-color:var(--primary)}
.add-cat-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;background:rgba(18,18,32,.3);border:2px dashed var(--border);border-radius:var(--radius-lg);cursor:pointer;font-size:.9rem;font-weight:600;color:var(--text2);transition:var(--transition);width:100%}
.add-cat-btn:hover{border-color:var(--primary);color:var(--primary);background:rgba(124,92,252,.05);transform:translateY(-1px)}
.preview-panel{position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto;background:rgba(12,12,20,.6);display:flex;flex-direction:column;backdrop-filter:blur(8px)}
.preview-toolbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(12,12,20,.5);flex-shrink:0}
.preview-toolbar span{font-size:.78rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.phone-frame{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:24px;overflow-y:auto}
.phone-screen{width:375px;min-height:600px;border-radius:var(--radius-xl);overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6);border:1px solid rgba(60,60,100,.25);position:relative}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);display:none;place-items:center;z-index:999;padding:20px}
.modal-overlay.show{display:grid}
.modal{background:rgba(20,20,35,.95);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px;max-width:520px;width:100%;text-align:center;position:relative;animation:modalIn .4s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(20px)}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(24px)}to{opacity:1;transform:none}}
.modal h2{font-size:1.5rem;font-weight:800;margin-bottom:8px}
.modal p{color:var(--text2);font-size:.9rem;margin-bottom:24px}
.modal .url-box{background:rgba(7,7,14,.8);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-family:'DM Sans',monospace;font-size:.82rem;word-break:break-all;color:var(--success);text-align:left;margin-bottom:16px;max-height:120px;overflow-y:auto}
.modal .qr-box{margin:20px auto;width:180px;height:180px;background:var(--surface2);border-radius:var(--radius);display:grid;place-items:center;overflow:hidden}
.modal .qr-box img{width:100%;height:100%;object-fit:contain}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
.modal .close-modal{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text3);font-size:1.3rem;cursor:pointer;transition:var(--transition)}
.modal .close-modal:hover{color:var(--text);transform:rotate(90deg)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(30,30,50,.95);border:1px solid var(--border);border-radius:var(--radius);padding:12px 24px;color:var(--text);font-size:.85rem;font-weight:500;backdrop-filter:blur(16px);z-index:9999;transition:transform .4s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.success{border-color:rgba(52,211,153,.4);color:var(--success)}
#viewer{display:none;min-height:100vh}
/* Elegant */
.tpl-elegant{--tb:#0d0d1a;--ts:#161628;--tbr:#2a2a44;--tt:#f0eee6;--tt2:#b8b4a8;--tt3:#7a7668;--tp:var(--menu-primary,#c9a96e);--ta:var(--menu-accent,#e8c47c);background:var(--tb);color:var(--tt);font-family:var(--menu-font,'Playfair Display'),Georgia,serif}
.tpl-elegant .menu-header{text-align:center;padding:48px 24px 36px;background:linear-gradient(180deg,rgba(201,169,110,.08),transparent);border-bottom:1px solid var(--tbr)}
.tpl-elegant .menu-header h1{font-size:2.2rem;font-weight:700;color:var(--tp)}.tpl-elegant .menu-header .tagline{color:var(--tt2);font-style:italic;margin-top:6px;font-size:.95rem}
.tpl-elegant .menu-header .rest-logo{font-size:2.5rem;margin-bottom:8px}
.tpl-elegant .menu-body{padding:24px 20px 40px}.tpl-elegant .menu-cat{margin-bottom:32px}
.tpl-elegant .menu-cat h2{font-size:1.15rem;font-weight:600;color:var(--tp);text-transform:uppercase;letter-spacing:.15em;text-align:center;margin-bottom:20px;position:relative;padding:12px 0}
.tpl-elegant .menu-cat h2::before,.tpl-elegant .menu-cat h2::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--tbr)}
.tpl-elegant .menu-cat h2::before{left:0}.tpl-elegant .menu-cat h2::after{right:0}
.tpl-elegant .menu-item{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dotted var(--tbr)}.tpl-elegant .menu-item:last-child{border-bottom:none}
.tpl-elegant .item-left{flex:1;padding-right:12px}.tpl-elegant .item-name{font-weight:600;font-size:1rem}.tpl-elegant .item-desc{font-size:.8rem;color:var(--tt3);font-style:italic;margin-top:2px;font-family:'Inter',sans-serif}.tpl-elegant .item-price{font-weight:700;font-size:1rem;color:var(--ta);white-space:nowrap}
/* Modern */
.tpl-modern{--tb:#f5f5f7;--ts:#fff;--tbr:#e0e0e0;--tt:#1a1a1a;--tt2:#555;--tt3:#888;--tp:var(--menu-primary,#2563eb);--ta:var(--menu-accent,#3b82f6);background:var(--tb);color:var(--tt);font-family:var(--menu-font,'DM Sans'),'Inter',sans-serif}
.tpl-modern .menu-header{padding:40px 24px 32px;background:var(--ts);border-bottom:2px solid var(--tp);text-align:center}
.tpl-modern .menu-header h1{font-size:1.8rem;font-weight:700}.tpl-modern .menu-header .tagline{color:var(--tt2);font-size:.9rem;margin-top:4px}.tpl-modern .menu-header .rest-logo{font-size:2.5rem;margin-bottom:6px}
.tpl-modern .menu-body{padding:20px 16px 40px;max-width:480px;margin:0 auto}.tpl-modern .menu-cat{margin-bottom:28px}
.tpl-modern .menu-cat h2{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tp);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--tp)}
.tpl-modern .menu-item{background:var(--ts);border-radius:12px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:all .2s}
.tpl-modern .menu-item:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.tpl-modern .item-left{flex:1}.tpl-modern .item-name{font-weight:700;font-size:.95rem}.tpl-modern .item-desc{font-size:.78rem;color:var(--tt3);margin-top:2px}
.tpl-modern .item-price{font-weight:800;font-size:.95rem;color:var(--ts);background:var(--tp);padding:4px 12px;border-radius:20px;white-space:nowrap}
/* Rustic */
.tpl-rustic{--tb:#2c1810;--ts:#3a2218;--tbr:#5a3828;--tt:#f5e6d3;--tt2:#c4a882;--tt3:#8a7060;--tp:var(--menu-primary,#a5d6a7);--ta:var(--menu-accent,#81c784);background:var(--tb);color:var(--tt);font-family:var(--menu-font,'Playfair Display'),Georgia,serif}
.tpl-rustic .menu-header{text-align:center;padding:44px 24px 32px;background:linear-gradient(180deg,rgba(165,214,167,.06),transparent)}
.tpl-rustic .menu-header h1{font-size:2rem;font-weight:700;color:var(--tp)}.tpl-rustic .menu-header .tagline{color:var(--tt2);font-size:.9rem;margin-top:6px}.tpl-rustic .menu-header .rest-logo{font-size:2.5rem;margin-bottom:8px}
.tpl-rustic .menu-header::after{content:'';display:block;width:80px;height:2px;background:var(--tp);margin:18px auto 0;border-radius:2px}
.tpl-rustic .menu-body{padding:24px 20px 40px}.tpl-rustic .menu-cat{margin-bottom:30px}
.tpl-rustic .menu-cat h2{font-size:1.1rem;font-weight:600;color:var(--tp);margin-bottom:14px;padding-left:14px;border-left:3px solid var(--tp)}
.tpl-rustic .menu-item{padding:10px 0;border-bottom:1px solid var(--tbr)}.tpl-rustic .menu-item:last-child{border-bottom:none}
.tpl-rustic .item-top{display:flex;justify-content:space-between;align-items:baseline}.tpl-rustic .item-name{font-weight:600;font-size:.95rem}.tpl-rustic .item-price{font-weight:700;color:var(--ta)}.tpl-rustic .item-desc{font-size:.78rem;color:var(--tt3);margin-top:3px;font-family:'Inter',sans-serif}
/* Minimal */
.tpl-minimal{--tb:#fff;--ts:#fafafa;--tbr:#eaeaea;--tt:#111;--tt2:#555;--tt3:#999;--tp:var(--menu-primary,#111);--ta:var(--menu-accent,#333);background:var(--tb);color:var(--tt);font-family:var(--menu-font,'Inter'),system-ui,sans-serif}
.tpl-minimal .menu-header{padding:48px 24px 40px;text-align:center;border-bottom:1px solid var(--tbr)}
.tpl-minimal .menu-header h1{font-size:1.6rem;font-weight:300;letter-spacing:.08em;text-transform:uppercase;color:var(--tp)}.tpl-minimal .menu-header .tagline{color:var(--tt3);font-size:.82rem;margin-top:8px;font-weight:300}.tpl-minimal .menu-header .rest-logo{font-size:2.5rem;margin-bottom:8px}
.tpl-minimal .menu-body{padding:32px 24px 48px;max-width:500px;margin:0 auto}.tpl-minimal .menu-cat{margin-bottom:36px}
.tpl-minimal .menu-cat h2{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--tt3);margin-bottom:16px}
.tpl-minimal .menu-item{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}

/* Neon */

.tpl-neon .menu-header{text-align:center;padding:48px 24px 36px;background:radial-gradient(ellipse at center,rgba(0,245,255,.05),transparent 70%)}
.tpl-neon .menu-header h1{font-size:2rem;font-weight:800;color:var(--tp);text-shadow:0 0 20px var(--tp),0 0 40px rgba(0,245,255,.3)}.tpl-neon .menu-header .tagline{color:var(--tt2);font-size:.85rem;margin-top:8px;letter-spacing:.1em;text-transform:uppercase}.tpl-neon .menu-header .rest-logo{font-size:2.5rem;margin-bottom:8px;filter:drop-shadow(0 0 8px var(--tp))}
.tpl-neon .menu-body{padding:24px 20px 40px}.tpl-neon .menu-cat{margin-bottom:32px}
.tpl-neon .menu-cat h2{font-size:.85rem;font-weight:700;color:var(--ta);text-transform:uppercase;letter-spacing:.15em;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--ta);text-shadow:0 0 10px var(--ta)}
.tpl-neon .menu-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:6px;background:rgba(20,20,50,.5);border-radius:10px;border:1px solid var(--tbr);transition:all .2s}

.tpl-neon .item-left{flex:1}.tpl-neon .item-name{font-weight:600;font-size:.92rem}.tpl-neon .item-desc{font-size:.75rem;color:var(--tt3);margin-top:2px}.tpl-neon .item-price{font-weight:800;font-size:.9rem;color:var(--tp);text-shadow:0 0 8px rgba(0,245,255,.4)}
/* Garden */
.tpl-garden{--tb:#f4f8f0;--ts:#fff;--tbr:#d4e5c4;--tt:#2d3a1f;--tt2:#5a6e47;--tt3:#8a9a78;--tp:var(--menu-primary,#4a7c3a);--ta:var(--menu-accent,#6b9e5a);background:var(--tb);color:var(--tt);font-family:var(--menu-font,'Cormorant Garamond'),Georgia,serif}
.tpl-garden .menu-header{text-align:center;padding:48px 24px 36px;background:linear-gradient(180deg,rgba(74,124,58,.06),transparent)}

.tpl-garden .menu-cat h2{font-size:1.1rem;font-weight:600;color:var(--tp);margin-bottom:14px;text-align:center;padding:8px 0}
.tpl-garden .menu-cat h2::before{content:'🌿';margin-right:8px;font-size:.9rem}

.tpl-glass .menu-header{text-align:center;padding:56px 24px 40px;position:relative;z-index:2}

.tpl-glass .menu-header .tagline{color:var(--tt2);font-size:.88rem;margin-top:8px;font-weight:300}

.tpl-glass .menu-cat{margin-bottom:28px}
.tpl-glass .menu-cat h2{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--tt2);margin-bottom:14px;text-align:center}

  display:flex;justify-content:space-between;align-items:center;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--glass-outer-shadow);overflow:hidden
}
/* Glass tint + inner shadow layer */
.tpl-glass .menu-item::before{content:'';position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
  background:rgba(var(--glass-tint),var(--glass-tint-opacity));
  box-shadow:inset 0 0 var(--glass-inner-shadow-blur) var(--glass-inner-shadow-spread) var(--glass-inner-shadow-color);
  border-top:1px solid rgba(255,255,255,.25);border-left:1px solid rgba(255,255,255,.12);border-right:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.04)}
/* Refraction / blur layer */
.tpl-glass .menu-item::after{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;
  backdrop-filter:blur(28px) saturate(1.8) brightness(1.05);-webkit-backdrop-filter:blur(28px) saturate(1.8) brightness(1.05)}

.tpl-glass .menu-item>.glass-spec{position:absolute;top:0;left:0;right:0;height:50%;border-radius:var(--glass-radius) var(--glass-radius) 0 0;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 100%)}
.tpl-glass .menu-item:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.25)}

.tpl-glass .menu-cat-desc{color:var(--tt3)}
.tpl-glass .badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--tt2)}

.badge-new{background:rgba(52,211,153,.15);color:#34d399}.badge-popular{background:rgba(251,191,36,.15);color:#f59e0b}.badge-spicy{background:rgba(239,68,68,.15);color:#ef4444}.badge-vegan{background:rgba(74,222,128,.15);color:#4ade80}.badge-chef{background:rgba(124,92,252,.15);color:#7c5cfc}

        <div class="font-options" id="fontOptions"></div>

  {id:'display',label:'Display',family:"'Outfit','Inter',sans-serif",preview:'Aa'},
  {id:'hand',label:'Handwritten',family:"'Caveat',cursive",preview:'Aa'},
  {id:'minimal',label:'Minimal',family:"'Inter',system-ui,sans-serif",preview:'Aa'}
];
const TMPLS = [
  {id:'elegant',name:'Elegant Dark',desc:'Luxury dining',cls:'tmpl-elegant',primary:'#c9a96e',accent:'#e8c47c'},
  {id:'modern',name:'Fresh Modern',desc:'Clean cards',cls:'tmpl-modern',primary:'#2563eb',accent:'#3b82f6'},
  {id:'rustic',name:'Rustic Bistro',desc:'Warm & cozy',cls:'tmpl-rustic',primary:'#a5d6a7',accent:'#81c784'},
  {id:'minimal',name:'Minimal Clean',desc:'Sophisticated',cls:'tmpl-minimal',primary:'#111111',accent:'#333333'},
  {id:'neon',name:'Neon Glow',desc:'Vibrant night',cls:'tmpl-neon',primary:'#00f5ff',accent:'#ff00e5'},
  {id:'garden',name:'Garden Fresh',desc:'Organic feel',cls:'tmpl-garden',primary:'#4a7c3a',accent:'#6b9e5a'},
  {id:'glass',name:'Liquid Glass',desc:'Glassmorphism',cls:'tmpl-glass',primary:'#a78bfa',accent:'#c4b5fd'}
];
const BADGES = ['','new','popular','spicy','vegan','chef'];
const BADGE_LABELS = {'':'—','new':'🆕 New','popular':'🔥 Popular','spicy':'🌶 Spicy','vegan':'🌱 Vegan','chef':'⭐ Chef Pick'};
let state = {t:'elegant',p:'#c9a96e',a:'#e8c47c',logo:'🍽',font:'serif'};
let catId = 0;

// ═══ INIT ═══
(function(){
  const h = location.hash;
  if(h && h.startsWith('#data=')){document.getElementById('creator').style.display='none';document.getElementById('viewer').style.display='block';
    try{const j=LZString.decompressFromEncodedURIComponent(h.slice(6));if(!j)throw 0;const d=JSON.parse(j);renderViewer(d);document.title=(d.name||'Menu')+' — Digital Menu'}
    catch(e){document.getElementById('viewerWrap').innerHTML='<div style="text-align:center;padding:80px 24px"><h1 style="font-size:2rem;margin-bottom:12px">😕 Invalid Menu Link</h1><p style="color:#888">This link appears corrupted.</p></div>'}
  } else { initCreator(); }
})();

function initCreator(){
  buildEmojis(); buildFonts(); buildTemplates();
  addCategory('Starters','Light bites to start your meal',[{name:'Bruschetta',desc:'Toasted bread with tomatoes & basil',price:'8.50',badge:'',img:''},{name:'Soup of the Day',desc:'Ask your server',price:'6.00',badge:'popular',img:''}]);
  addCategory('Main Course','Chef\'s finest creations',[{name:'Grilled Salmon',desc:'Atlantic salmon with lemon butter',price:'24.00',badge:'chef',img:''},{name:'Ribeye Steak',desc:'12oz prime cut with sides',price:'32.00',badge:'',img:''}]);
  updatePreview(); initParticles();
}

// ═══ PARTICLES ═══
function initParticles(){
  const c=document.getElementById('bgCanvas'),x=c.getContext('2d');
  let w,h,pts=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight;pts=[];for(let i=0;i<50;i++)pts.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.5,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,o:Math.random()*.3+.1})}
  resize(); addEventListener('resize',resize);
  (function draw(){x.clearRect(0,0,w,h);pts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>w)p.dx*=-1;if(p.y<0||p.y>h)p.dy*=-1;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=`rgba(124,92,252,${p.o})`;x.fill()});requestAnimationFrame(draw)})();
}

// ═══ BUILD UI ═══
function buildEmojis(){
  const g=document.getElementById('emojiGrid');
  EMOJIS.forEach(e=>{const d=document.createElement('div');d.className='emoji-opt'+(e===state.logo?' active':'');d.textContent=e;d.onclick=()=>{g.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('active'));d.classList.add('active');state.logo=e;updatePreview()};g.appendChild(d)});
}
function buildFonts(){
  const g=document.getElementById('fontOptions');
  FONTS.forEach(f=>{const d=document.createElement('div');d.className='font-opt'+(f.id===state.font?' active':'');d.innerHTML=`<div class="font-preview" style="font-family:${f.family}">${f.preview}</div><div class="font-label">${f.label}</div>`;d.onclick=()=>{g.querySelectorAll('.font-opt').forEach(x=>x.classList.remove('active'));d.classList.add('active');state.font=f.id;updatePreview()};g.appendChild(d)});
}
function buildTemplates(){
  const g=document.getElementById('templateGrid');
  TMPLS.forEach(t=>{const d=document.createElement('div');d.className=`template-card ${t.cls}`+(t.id===state.t?' active':'');d.innerHTML=`<div class="tmpl-check">✓</div><div class="tmpl-preview"></div><div class="tmpl-info"><div class="tmpl-name">${t.name}</div><div class="tmpl-desc">${t.desc}</div></div>`;d.onclick=()=>{g.querySelectorAll('.template-card').forEach(x=>x.classList.remove('active'));d.classList.add('active');state.t=t.id;document.getElementById('colorPrimary').value=t.primary;document.getElementById('colorAccent').value=t.accent;state.p=t.primary;state.a=t.accent;updatePreview()};g.appendChild(d)});
}

// ═══ CATEGORIES ═══
function addCategory(name='',desc='',items=[]){
  const id='c'+(catId++),ct=document.getElementById('categoriesContainer'),div=document.createElement('div');
  div.className='category-block fade-up';div.id=id;
  let ih='';if(items.length)items.forEach(it=>ih+=itemRow(id,it.name,it.desc,it.price,it.badge,it.img));
  div.innerHTML=`<div class="cat-header"><input type="text" placeholder="Category name" value="${esc(name)}" oninput="updatePreview()"><div class="cat-actions"><button class="btn-icon" title="Delete" onclick="document.getElementById('${id}').remove();updatePreview()">🗑</button></div></div><input type="text" class="cat-desc-input" placeholder="Category description (optional)" value="${esc(desc)}" oninput="updatePreview()"><div class="items-list" id="${id}_i">${ih}</div><button class="add-item-btn" onclick="addItem('${id}')">＋ Add Item</button>`;
  ct.appendChild(div);if(!items.length)addItem(id);updatePreview();
}
function itemRow(cid,n='',d='',pr='',b='',img=''){
  const uid='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  return `<div class="item-row"><div class="ir-top"><input type="text" placeholder="Item name" value="${esc(n)}" oninput="updatePreview()"><input type="text" placeholder="Description" value="${esc(d)}" oninput="updatePreview()"><input type="text" placeholder="Price" value="${esc(pr)}" oninput="updatePreview()"><select onchange="updatePreview()">${BADGES.map(x=>`<option value="${x}"${x===b?' selected':''}>${BADGE_LABELS[x]}</option>`).join('')}</select><button class="btn-icon" style="width:34px;height:34px;font-size:.9rem" onclick="this.closest('.item-row').remove();updatePreview()">✕</button></div><div class="ir-bottom"><input type="text" class="img-input" placeholder="Image URL (optional)" value="${esc(img)}" oninput="updateImgPreview(this);updatePreview()"><div class="img-actions">${img?`<img src="${esc(img)}" class="img-preview" id="${uid}_p">`:'<img class="img-preview" style="display:none" id="'+uid+'_p">'}<label class="img-upload-btn">📷 Upload<input type="file" accept="image/*" style="display:none" onchange="handleImgUpload(this)"></label></div></div></div>`;
}
function addItem(cid){const l=document.getElementById(cid+'_i');l.insertAdjacentHTML('beforeend',itemRow(cid));l.lastElementChild.querySelector('input').focus()}
function handleImgUpload(input){
  const file=input.files[0];if(!file)return;const row=input.closest('.item-row'),urlInput=row.querySelector('.img-input'),preview=row.querySelector('.img-preview');
  const r=new FileReader();r.onload=function(e){
    const img=new Image();img.onload=function(){
      const c=document.createElement('canvas'),max=200;let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=h*(max/w);w=max}else{w=w*(max/h);h=max}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const data=c.toDataURL('image/jpeg',0.6);
      urlInput.value=data;preview.src=data;preview.style.display='block';updatePreview();
    };img.src=e.target.result;
  };r.readAsDataURL(file);
}
function updateImgPreview(input){const p=input.closest('.ir-bottom').querySelector('.img-preview');if(input.value){p.src=input.value;p.style.display='block';p.onerror=()=>{p.style.display='none'}}else{p.style.display='none'}}

// ═══ GATHER ═══
function gatherData(){
  const d={t:state.t,p:document.getElementById('colorPrimary').value,a:document.getElementById('colorAccent').value,name:document.getElementById('restName').value.trim(),tag:document.getElementById('restTagline').value.trim(),cur:document.getElementById('restCurrency').value.trim()||'$',logo:state.logo,font:state.font,phone:document.getElementById('restPhone').value.trim(),addr:document.getElementById('restAddress').value.trim(),hours:document.getElementById('restHours').value.trim(),insta:document.getElementById('restInsta').value.trim(),fb:document.getElementById('restFb').value.trim(),wa:document.getElementById('restWa').value.trim(),banner:document.getElementById('restBanner').value.trim(),cats:[]};
  document.querySelectorAll('.category-block').forEach(b=>{const cn=b.querySelector('.cat-header input').value.trim(),cd=b.querySelector('.cat-desc-input').value.trim(),items=[];b.querySelectorAll('.item-row').forEach(r=>{const ii=r.querySelectorAll('.ir-top input'),sel=r.querySelector('select'),imgInput=r.querySelector('.img-input'),n=ii[0].value.trim();if(n)items.push({n,d:ii[1].value.trim(),pr:ii[2].value.trim(),b:sel?sel.value:'',img:imgInput?imgInput.value.trim():''})});if(cn||items.length)d.cats.push({c:cn,cd,i:items})});return d;
}

// ═══ RENDER ═══
function fontCSS(fid){const f=FONTS.find(x=>x.id===fid);return f?f.family:"'Inter',sans-serif"}
function renderMenu(d){
  const tpl='tpl-'+(d.t||'elegant'),cur=d.cur||'$',name=d.name||'Your Restaurant',tag=d.tag||'',logo=d.logo||'🍽';
  const isGlass=d.t==='glass';
  const banner=d.banner?`<div style="width:100%;height:160px;background:url('${esc(d.banner)}') center/cover;border-radius:0"></div>`:'';
  let cats='';(d.cats||[]).forEach(cat=>{let items='';(cat.i||[]).forEach(it=>{
    const badge=it.b?`<span class="badge badge-${it.b}">${BADGE_LABELS[it.b]||it.b}</span>`:'';
    const imgTag=it.img?`<img src="${esc(it.img)}" class="item-img" onerror="this.style.display='none'">`:'';const hasCls=it.img?' has-img':'';
    const spec=isGlass?'<div class="glass-spec"></div>':'';
    if(d.t==='rustic')items+=`<div class="menu-item${hasCls}">${imgTag}<div class="item-top"><div class="item-name">${esc(it.n)}${badge}</div><div class="item-price">${esc(cur)}${esc(it.pr)}</div></div>${it.d?`<div class="item-desc">${esc(it.d)}</div>`:''}</div>`;
    else items+=`<div class="menu-item${hasCls}">${spec}${imgTag}<div class="item-row-inner" style="display:flex;justify-content:space-between;align-items:baseline;position:relative;z-index:3;width:100%"><div class="item-left"><div class="item-name">${esc(it.n)}${badge}</div>${it.d?`<div class="item-desc">${esc(it.d)}</div>`:''}</div><div class="item-price">${esc(cur)}${esc(it.pr)}</div></div></div>`;
  });const catDesc=cat.cd?`<div class="menu-cat-desc">${esc(cat.cd)}</div>`:'';
  cats+=`<div class="menu-cat"><h2>${esc(cat.c||'Untitled')}</h2>${catDesc}${items}</div>`});
  let social='';if(d.insta||d.fb||d.wa){social='<div class="menu-social">';if(d.insta)social+=`<a href="https://instagram.com/${d.insta.replace('@','')}" target="_blank" title="Instagram">📸</a>`;if(d.fb)social+=`<a href="${d.fb.startsWith('http')?d.fb:'https://facebook.com/'+d.fb}" target="_blank" title="Facebook">📘</a>`;if(d.wa)social+=`<a href="https://wa.me/${d.wa.replace(/[^0-9+]/g,'')}" target="_blank" title="WhatsApp">💬</a>`;social+='</div>'}
  const contact=(d.phone||d.addr||d.hours||social)?`<div class="menu-contact">${d.phone?`<div>📞 ${esc(d.phone)}</div>`:''}${d.addr?`<div>📍 ${esc(d.addr)}</div>`:''}${d.hours?`<div>🕐 ${esc(d.hours)}</div>`:''}${social}</div>`:'';
  const glassBg=isGlass?'<div class="glass-bg"></div>':'';
  return `<div class="${tpl}" style="--menu-primary:${d.p||'#c9a96e'};--menu-accent:${d.a||'#e8c47c'};--menu-font:${fontCSS(d.font)};min-height:100%">${glassBg}${banner}<div class="menu-header"><div class="rest-logo">${logo}</div><h1>${esc(name)}</h1>${tag?`<div class="tagline">${esc(tag)}</div>`:''}</div><div class="menu-body">${cats||'<p style="text-align:center;opacity:.4;padding:40px">Add items to see your menu</p>'}</div>${contact}</div>`;
}
function updatePreview(){document.getElementById('previewScreen').innerHTML=renderMenu(gatherData())}
function renderViewer(d){const w=document.getElementById('viewerWrap');w.innerHTML=renderMenu(d)+`<div class="viewer-footer">Powered by <a href="${location.origin+location.pathname}">MenuCraft</a></div>`;const bgs={elegant:'#0d0d1a',modern:'#f5f5f7',rustic:'#2c1810',minimal:'#fff',neon:'#080818',garden:'#f4f8f0',glass:'#1a1a3e'};document.body.style.background=bgs[d.t]||'#0d0d1a'}

// ═══ PREVIEW / GENERATE ═══
function previewFullScreen(){const d=gatherData();if(!d.name)return toast('Please enter a restaurant name','');const u=location.origin+location.pathname+'#data='+LZString.compressToEncodedURIComponent(JSON.stringify(d));window.open(u,'_blank')}
async function generateLink(){
  const d=gatherData();if(!d.name)return toast('Please enter a restaurant name','');if(!d.cats.length||!d.cats.some(c=>c.i.length))return toast('Add at least one category with items','');
  const modal=document.getElementById('modal'),mc=document.getElementById('modalContent');modal.classList.add('show');mc.innerHTML='<h2>🔗 Generating...</h2><p>Compressing & shortening</p><div class="spinner"></div>';
  try{const j=JSON.stringify(d),compressed=LZString.compressToEncodedURIComponent(j),longUrl=location.origin+location.pathname+'#data='+compressed;
    let short=longUrl,qr='';
    try{const r=await fetch('https://lnk.ua/api/v1/link/create',{method:'POST',headers:{Accept:'application/json',Authorization:'Bearer 146|UWjh5Vj21g36sirenQoAnLo1YyI8jxzT1gtK2NO9026547ad'},body:(()=>{const f=new FormData();f.append('link',longUrl);return f})()});const res=await r.json();if(res.result&&res.result.lnk){short=res.result.lnk;qr=res.result.qr||''}}catch(e){console.warn('Shortener failed:',e)}
    mc.innerHTML=`<h2>✅ Your Menu is Ready!</h2><p>Share this link with your customers</p><div class="url-box" id="urlBox">${esc(short)}</div>${qr?`<div class="qr-box"><img src="${esc(qr)}" alt="QR Code"></div>`:''}<div class="modal-actions"><button class="btn btn-primary" onclick="copyUrl()">📋 Copy Link</button><button class="btn btn-secondary" onclick="window.open('${esc(short)}','_blank')">🔗 Open Menu</button></div><div style="margin-top:14px;font-size:.7rem;color:var(--text3)">${short!==longUrl?'🔗 Shortened with lnk.ua':'⚠️ Using full URL'}</div>`;
  }catch(e){mc.innerHTML=`<h2>❌ Error</h2><p style="color:var(--danger)">${esc(e.message)}</p><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`}
}
function copyUrl(){const t=document.getElementById('urlBox').textContent;navigator.clipboard.writeText(t).then(()=>toast('✅ Link copied!','success')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('✅ Link copied!','success')})}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(msg,cls){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(cls?' '+cls:'');setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>t.classList.remove('show'),3000)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
</script>
