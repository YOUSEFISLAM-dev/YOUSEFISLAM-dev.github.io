<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Pro 9.1v</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .security-watermark {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 200px,
                    rgba(0, 212, 255, 0.008) 200px,
                    rgba(0, 212, 255, 0.008) 400px);
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 255, 136, 0.05));
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* Player Container */
        .player-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        #vdo-player {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Empty iframe placeholder */
        #player-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            max-width: 400px;
        }

        .error.show {
            display: block;
        }

        /* Status Bar */
        .status-bar {
            margin-top: 12px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.75rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
        }

        .security-badge {
            margin-left: auto;
            padding: 4px 10px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            font-size: 0.65rem;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="security-watermark"></div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🎬 Video Player</h2>
            </div>
        </div>

        <div class="main-content">
            <div class="player-container" id="playerContainer">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Loading secure player...</p>
                </div>
                <div class="error" id="error-message"></div>
                
                <!-- Empty iframe - You can add your VdoCipher embed here -->
                <div id="vdo-player">
                    <div style="padding-top:56%;position:relative;">
<iframe src="https://player.vdocipher.com/v2/?otp=20160313versUSE3232hBhwWHPoKId5GkAjFRJV7S82vzzsSbITi1gvhLC2JIFx6&playbackInfo=eyJ2aWRlb0lkIjoiMGViMDM5NmI3NGIyNDI0NGJlMWJlZWI0YWJiM2Y4YzUifQ==" style="border:0;max-width:100%;position:absolute;top:0;left:0;height:100%;width:100%;" allowFullScreen="true" allow="encrypted-media"></iframe>
</div>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span>Secure Streaming Active</span>
                </div>
                <div class="security-badge">
                    🔒 Protected Content
                </div>
            </div>
        </div>
    </div>


</body>
</html>
